# EMPTY on purpose: the :6969 door is DISABLED. llm-door.sh enable writes the
# server block here (listening on the box's external addresses at :6969) and
# HUPs the cardmode nginx; disable empties the file again. Empty until then
# keeps the reload path valid while backends still publish 0.0.0.0:6969.
# llm-door.sh render (cardmode-proxy ExecStartPre) re-derives the listen lines
# from the live interfaces at every proxy start once enabled.
