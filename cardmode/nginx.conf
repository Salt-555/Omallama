# cardmode front proxy — the single public door for ComfyUI.
# nginx listens on :8188 (where comfy used to live); comfy is moved to
# 127.0.0.1:8189 so NOTHING reaches it without passing here.
#
# POST /prompt (and the new-frontend /api/prompt mirror) authenticates
# against the cardmode reconciler via auth_request: nginx HOLDS the prompt
# while the reconciler switches the Blackwell into gen mode, then forwards
# it. Non-2xx from the gate = request refused (fail closed).
# Everything else (UI, /ws progress websockets, uploads, history) proxies
# straight through.
#
# Run by cardmode-proxy.service as a user instance:
#   nginx -p ~/.local/state/cardmode -c ~/.config/cardmode/nginx.conf
# All relative paths (pid/logs/temp) live under that prefix.

worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream comfy {
        server 127.0.0.1:8189;
    }

    server {
        listen 8188;
        server_name _;
        client_max_body_size 2048m;

        # internal gate -> cardmode reconciler. The subrequest blocks for as
        # long as the switch takes (drain cap + reload); keep this above
        # llm_drain_cap_seconds + switch time in modes.json.
        # NOTE: auth subrequests arrive as GET regardless of the parent
        # method (verified live) -- the arbiter decides on X-Original-Method.
        location = /__cardmode_gate {
            internal;
            proxy_pass http://127.0.0.1:8190/gate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_read_timeout 900s;
            proxy_connect_timeout 5s;
        }

        # prompt submission, old API surface: hold until the card is in gen mode
        location = /prompt {
            auth_request /__cardmode_gate;  # GET /prompt passes instantly; the gate itself gates POSTs
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        # same gate on the new frontend's /api mirror
        location = /api/prompt {
            auth_request /__cardmode_gate;  # GET /prompt passes instantly; the gate itself gates POSTs
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        # everything else: UI, websockets, uploads, history, /free, /view
        location / {
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
