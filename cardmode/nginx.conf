# cardmode front proxy — the single public door for ComfyUI.
# nginx listens on :8188 (where comfy used to live); comfy is moved to
# 127.0.0.1:8189 so NOTHING reaches it without passing here.
#
# POST /prompt (and the new-frontend /api/prompt mirror) authenticates
# against the cardmode reconciler via auth_request: nginx HOLDS the prompt
# while the reconciler switches the Blackwell into gen mode, then forwards
# it. Non-2xx from the gate = request refused (fail closed).
# Everything else (UI, /ws progress websockets, uploads, per-id history)
# proxies straight through. History/queue reads are per-IP siloed: comfy
# (patched server.py) tags each prompt with the source address (stamped by
# nginx as X-Comfy-Client) and filters history/queue/jobs to the owner.
# Local bulk reads were loopback-only until 2026-10-17; see the silo block.
#
# Run by cardmode-proxy.service as a user instance:
#   nginx -p ~/.local/state/cardmode -c ~/.config/cardmode/nginx.conf
# All relative paths (pid/logs/temp) live under that prefix.

worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 1024;  # raised for the LLM door: streaming requests hold a connection for minutes
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;
    access_log logs/access.log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream comfy {
        server 127.0.0.1:8189;
    }

    # ---- LLM per-client lane limits (:8191) --------------------------------
    # Second public door: fronts WHATEVER backend currently serves ALLMIND on
    # 127.0.0.1:6969 (basalt / sglang / gufo / llama.cpp all answer there), so
    # the limit layer survives backend and mode switches untouched. cardmode's
    # own gates and probes keep talking to loopback :6969 directly and never
    # pass through here.
    #
    # limit_conn counts a connection only while it has a request IN FLIGHT
    # (idle keep-alives are free), which is the right unit for "how many lanes
    # does this client get". A per-IP NUMBER is not something limit_conn can
    # take from a variable (number is a fixed value per the module docs), so
    # the limits are tiered: one zone per lane count, 1..8, and a client is
    # keyed into EXACTLY ONE tier's zone by the generated maps below (empty
    # key = not accounted = unlimited). ~/.config/cardmode/llm-limits.map is
    # GENERATED by ~/.config/omarchy/plugins/salt.llama-server/llmlimits.sh
    # from ~/.config/llama-server/llm-limits.json — do not hand-edit.
    # Unlisted clients and loopback match no zone and are unlimited, so the
    # box behaves exactly as before until a limit is set.
    limit_conn_status 429;
    limit_conn_zone $llm_k1 zone=llm1:10m;
    limit_conn_zone $llm_k2 zone=llm2:10m;
    limit_conn_zone $llm_k3 zone=llm3:10m;
    limit_conn_zone $llm_k4 zone=llm4:10m;
    limit_conn_zone $llm_k5 zone=llm5:10m;
    limit_conn_zone $llm_k6 zone=llm6:10m;
    limit_conn_zone $llm_k7 zone=llm7:10m;
    limit_conn_zone $llm_k8 zone=llm8:10m;
    include /home/salt/.config/cardmode/llm-limits.map;

    # The :6969 door (see llm-door.sh): an EMPTY include until enabled. When
    # written, it holds the server block that listens on the box's EXTERNAL
    # addresses at :6969 — so external clients keep their endpoint AND pass
    # the per-IP limits, re-derived from the live interfaces at every proxy
    # start (ExecStartPre llm-door.sh render). Loopback :6969 stays the
    # backends' own port (cardmode gates + local Hermes talk to it directly,
    # unlimited). The old :8191 door was retired 2026-11-23 once :6969 became
    # door-able — one door, one copy of the limit location.
    include /home/salt/.config/cardmode/llm-door-6969.conf;

    # Per-client silo identity: every request carries its source address as
    # X-Comfy-Client. ComfyUI (server.py, patched) records it with each
    # submitted prompt and filters /history, /queue and /api/jobs reads to the
    # owner. Loopback = "local" = sees everything (Krita, local tooling).
    # No credentials; the IP is the client. Same-IP devices share one silo.
    map $remote_addr $comfy_client {
        127.0.0.1 local;
        ::1       local;
        default   $remote_addr;
    }

    server {
        listen 8188;
        server_name _;
        client_max_body_size 2048m;
        # user-instance nginx cannot write the system default /var/lib/nginx;
        # keep spooled request bodies under the -p prefix (uploads, large POSTs)
        client_body_temp_path client_body;

        # internal gate -> cardmode reconciler. The subrequest blocks until the
        # card is in gen mode, and that wait is a STATE with no deadline (drain,
        # card handoff and load each hold as long as the condition takes).
        # nginx has no "infinite", so this is a 24 h backstop: anything shorter
        # turns a long wait into a 504 the client cannot distinguish from a bug.
        # NOTE: auth subrequests arrive as GET regardless of the parent
        # method (verified live) -- the arbiter decides on X-Original-Method.
        location = /__cardmode_gate {
            internal;
            proxy_pass http://127.0.0.1:8190/gate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_read_timeout 86400s;
            proxy_connect_timeout 5s;
        }

        # prompt submission, old API surface: hold until the card is in gen mode
        location = /prompt {
            auth_request /__cardmode_gate;  # GET /prompt passes instantly; the gate itself gates POSTs
            # A gate denial arrives as 403 (auth_request forwards only 401/403
            # verbatim; anything else would become a bodiless 500). Re-emit it
            # as a 503 that CARRIES THE REASON, so a refused prompt says why
            # instead of looking like a broken ComfyUI. Real upstream 500s are
            # untouched: they are not 403.
            auth_request_set $cardmode_reason $upstream_http_x_cardmode_reason;
            error_page 403 = @cardmode_refused;
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
            proxy_read_timeout 600s;
        }

        # same gate on the new frontend's /api mirror
        location = /api/prompt {
            auth_request /__cardmode_gate;  # GET /prompt passes instantly; the gate itself gates POSTs
            auth_request_set $cardmode_reason $upstream_http_x_cardmode_reason;
            error_page 403 = @cardmode_refused;
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
            proxy_read_timeout 600s;
        }

        # Refusal surface. Keep the public contract (503: resubmit later) and
        # hand the arbiter's own words to the client instead of nginx's HTML.
        location @cardmode_refused {
            add_header X-Cardmode-Reason $cardmode_reason always;
            return 503 "cardmode: $cardmode_reason\n";
        }

        # ---- history / queue: per-IP silo, no more blanket 403 -------------
        # Replaces the 2026-10-17 loopback-only lockdown. Bulk prompt reads
        # used to be 403 for every remote client, which broke the web UI's
        # queue panel and Recent list on trusted boxes. Now every remote
        # client gets its OWN prompts in /history, /queue and /api/jobs (the
        # server filters by X-Comfy-Client, stamped above); other IPs'
        # prompts are invisible — a foreign id reads as unknown. Local
        # (loopback) callers still see everything. Prompts queued before the
        # silo (2026-10-17) have no owner and stay local-only.
        # --------------------------------------------------------------------
        location = /history {
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
        }

        location = /api/history {
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
        }

        location = /api/jobs {
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
        }

        location = /queue {
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
        }

        location = /api/queue {
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
        }

        # everything else: UI, websockets, uploads, /view, /free, per-id history
        location / {
            proxy_pass http://comfy;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Comfy-Client $comfy_client;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
